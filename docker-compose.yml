version: '3.8'

services:
  telix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telix
    restart: unless-stopped
    ports:
      - "2323:2323"
    volumes:
      - ./configs/telix.yaml:/etc/telix/telix.yaml:ro
      - telix-logs:/app/logs
    networks:
      - telix-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2323"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  fail2ban:
    image: crazymax/fail2ban:1.1.0
    container_name: telix-fail2ban
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/log && touch /data/log/fail2ban.log && exec /entrypoint.sh fail2ban-server -f -x -v start"]
    volumes:
      - ./fail2ban/telix.conf:/etc/fail2ban/filter.d/telix.conf:ro
      - ./fail2ban/jail.local:/data/jail.d/telix.local:ro
      - ./fail2ban/recidive.local:/data/jail.d/recidive.local:ro
      - telix-logs:/app/logs:ro
      - fail2ban-data:/data
    depends_on:
      telix:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  telix-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: telix-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - TELIX_HOST=telix
      - TELIX_PORT=2323
    networks:
      - telix-net
    depends_on:
      telix:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    container_name: telix-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/entrypoint.sh:/usr/local/bin/telix-entrypoint.sh:ro
      - nginx-certs:/etc/nginx/certs
    entrypoint: ["/usr/local/bin/telix-entrypoint.sh"]
    networks:
      - telix-net
    depends_on:
      - telix-web
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  telix-logs:
  fail2ban-data:
  nginx-certs:

networks:
  telix-net:
    driver: bridge
