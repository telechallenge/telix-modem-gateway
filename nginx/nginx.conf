worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream telix_web {
        server telix-web:3000;
    }

    # Grafana. Reachable by service name because both containers sit on
    # telix-net; it publishes 3001 to loopback/Tailscale as well, and that
    # path stays open and does not pass through here.
    upstream grafana_ui {
        server grafana:3000;
    }

    # --- Cloudflare edge networks ---
    # Source: https://www.cloudflare.com/ips/
    # Trust CF-Connecting-IP only from these ranges (real_ip), AND
    # deny any TCP peer that isn't one of them (geo check on
    # $realip_remote_addr, which is the pre-rewrite peer address).

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;

    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # $cf_client = 1 if the *TCP peer* (Cloudflare edge) is in a CF
    # range, else 0. Evaluated against $realip_remote_addr so the
    # real_ip module's rewrite of $remote_addr doesn't fool the check.
    geo $realip_remote_addr $cf_client {
        default 0;

        173.245.48.0/20    1;
        103.21.244.0/22    1;
        103.22.200.0/22    1;
        103.31.4.0/22      1;
        141.101.64.0/18    1;
        108.162.192.0/18   1;
        190.93.240.0/20    1;
        188.114.96.0/20    1;
        197.234.240.0/22   1;
        198.41.128.0/17    1;
        162.158.0.0/15     1;
        104.16.0.0/13      1;
        104.24.0.0/14      1;
        172.64.0.0/13      1;
        131.0.72.0/22      1;

        2400:cb00::/32     1;
        2606:4700::/32     1;
        2803:f800::/32     1;
        2405:b500::/32     1;
        2405:8100::/32     1;
        2a06:98c0::/29     1;
        2c0f:f248::/32     1;
    }

    # --- TLS ---
    #
    # One self-signed cert serves every vhost below. That works because the
    # Cloudflare SSL mode for this zone is "Full", which encrypts to the origin
    # without validating the cert — so adding a hostname needs no cert change.
    # Switching the zone to "Full (strict)" would break every vhost at once and
    # require a real Cloudflare Origin CA cert carrying a SAN per hostname.
    ssl_certificate     /etc/nginx/certs/telix.crt;
    ssl_certificate_key /etc/nginx/certs/telix.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    http2 on;

    # --- Shared proxy settings ---
    #
    # Defined once at http level so both vhosts proxy identically and cannot
    # drift apart.
    #
    # ⚠ proxy_set_header inheritance is ALL-OR-NOTHING. nginx inherits this set
    # from the enclosing level "if and only if there are no proxy_set_header
    # directives defined on the current level" — so adding a single
    # `proxy_set_header X-Anything ...` inside a location silently discards
    # EVERY header below it. Upgrade/Connection go first, which kills the
    # WebSocket the terminal runs on, and Host reverts to $proxy_host, which
    # makes Grafana build its redirects from the upstream name. If you need an
    # extra header in one location, repeat this whole block there too.
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Long enough for a modem session held open all afternoon, and for the
    # WebSocket behind Grafana Live.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # --- Default vhost: refuse anything we do not recognise ---
    #
    # Name-based routing means an unmatched Host would otherwise fall through to
    # whichever server block nginx loaded first, quietly serving one app under
    # the wrong name. This block claims that role instead and hangs up (444).
    # It also catches a direct hit on the origin IP.
    server {
        listen 443 ssl default_server;
        server_name _;
        return 444;
    }

    # --- Web terminal ---
    server {
        listen 443 ssl;
        server_name pcpursuit.net www.pcpursuit.net;

        # Reject anything not coming from a Cloudflare edge address.
        if ($cf_client = 0) {
            return 403;
        }

        location / {
            proxy_pass http://telix_web;
        }
    }

    # --- Grafana ---
    server {
        listen 443 ssl;
        server_name mon.pcpursuit.net;

        # Reject anything not coming from a Cloudflare edge address.
        if ($cf_client = 0) {
            return 403;
        }

        # Failsafe, NOT authentication. Cloudflare Access is the actual gate;
        # it adds a signed JWT as the Cf-Access-Jwt-Assertion request header on
        # every request it lets through. This only checks the header is
        # present, which is worthless against a forged header but is exactly
        # what catches the failure that matters: an Access application deleted,
        # expired or misconfigured, which would otherwise hand the whole
        # monitoring stack to the internet with only Grafana's login in the way.
        #
        # Consequence: mon.pcpursuit.net returns 403 until the Access app for
        # it exists. That is deliberate — fail closed. Delete this block to
        # serve Grafana with its own login as the only gate.
        if ($http_cf_access_jwt_assertion = "") {
            return 403;
        }

        location / {
            proxy_pass http://grafana_ui;
        }
    }
}
