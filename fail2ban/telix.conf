# Fail2ban filter for Telix Modem Gateway
# Place this file in /etc/fail2ban/filter.d/telix.conf

[Definition]
failregex = ^.*"event":"rate_limited".*"source_ip":"<HOST>".*$
            ^.*"event":"invalid_number".*"source_ip":"<HOST>".*$
            ^.*"event":"invalid_command".*"source_ip":"<HOST>".*$

ignoreregex =

# Author: Telix
# Description: Detects rate limiting events and invalid access attempts
