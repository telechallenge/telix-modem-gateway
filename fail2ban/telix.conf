# Fail2ban filter for Telix Modem Gateway
# Place this file in /etc/fail2ban/filter.d/telix.conf

[Definition]
failregex = ^\{.*"event"\s*:\s*"rate_limited".*"source_ip"\s*:\s*"<HOST>".*\}$
            ^\{.*"event"\s*:\s*"invalid_number".*"source_ip"\s*:\s*"<HOST>".*\}$
            ^\{.*"event"\s*:\s*"invalid_command".*"source_ip"\s*:\s*"<HOST>".*\}$
            ^\{.*"event"\s*:\s*"connection_rejected".*"source_ip"\s*:\s*"<HOST>".*\}$

ignoreregex =

# Author: Telix
# Description: Detects rate limiting events, invalid access attempts,
# and connection rejections from the Telix modem gateway.
