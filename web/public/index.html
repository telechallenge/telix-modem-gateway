<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telix</title>
  <!--
    Third-party code is pinned by content hash: a compromised CDN can serve a
    different file, but the browser will refuse to run it. `crossorigin` is
    required — without CORS the browser cannot read the body to hash it and
    blocks the load outright.

    These point at the files npm actually publishes, not at jsdelivr's
    `.min.` URLs. Those minified variants are generated by jsdelivr on demand
    and exist nowhere in the registry, so their bytes cannot be checked against
    anything, and a change to jsdelivr's minifier would silently break the hash.
    The files below were verified byte-for-byte against the npm tarballs, whose
    sha512 matches the registry's published integrity. Costs ~2.4 KB total —
    the published lib/xterm.js is already a production bundle.

    To re-derive after a version bump:
      curl -s <url> | openssl dgst -sha384 -binary | openssl base64 -A
  -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"
        integrity="sha384-8Xk9wy/gzEDUKrXtrmCFa2bBuK3BpjpDuL/p0SeKQX19Khl/M+lHOgD/CyYf7efP"
        crossorigin="anonymous">
  <link rel="stylesheet" href="css/terminal.css">
</head>
<body>
  <div class="crt-container">
    <div class="crt-monitor">
      <div class="crt-vents" aria-hidden="true"></div>
      <div class="crt-screen">
        <div id="terminal"></div>
        <div class="crt-bloom"></div>
        <div class="crt-mask"></div>
        <div class="crt-scanlines"></div>
        <div class="crt-glass"></div>
      </div>
      <div class="crt-chin">
        <span class="crt-brand">
          <span class="crt-brand-name">Telix</span>
          <span class="crt-brand-maker">by PC Pursuit</span>
        </span>
        <div class="crt-controls" aria-hidden="true">
          <span class="crt-knob"></span>
          <span class="crt-knob"></span>
          <span class="crt-button"></span>
          <span class="crt-button"></span>
          <span class="crt-power">
            <span class="crt-led"></span>
            <span class="crt-power-button"></span>
          </span>
        </div>
      </div>
      <div class="sticky-note" id="stickyNote" data-open="false" data-has-text="false">
        <button type="button" class="sticky-note-tab" id="stickyTab"
                aria-expanded="false" aria-controls="stickyBody" title="Show notes">
          <span class="sticky-note-tab-label">Notes</span>
          <span class="sticky-note-dot" aria-hidden="true"></span>
        </button>
        <div class="sticky-note-body" id="stickyBody" hidden>
          <!-- autocomplete=off: the browser restores form state on a reload,
               after our JS has filled the pad from storage, so without it the
               restored value silently overwrites what the store actually holds. -->
          <textarea class="sticky-note-text" id="stickyText" rows="8" spellcheck="false" autocomplete="off"
                    aria-label="Scratchpad — saved in this browser only"
                    placeholder="Numbers, handles, door codes&#8230;"></textarea>
          <span class="sticky-note-status" id="stickyStatus" aria-live="polite"></span>
        </div>
      </div>
    </div>
    <div class="crt-stand-neck"></div>
    <div class="crt-stand-base"></div>
    <div class="modem">
      <div class="modem-top"></div>
      <div class="modem-front">
        <div class="modem-leds">
          <div class="modem-led" data-led="hs"><span class="modem-led-label">HS</span><span class="modem-led-light"></span></div>
          <div class="modem-led" data-led="aa"><span class="modem-led-label">AA</span><span class="modem-led-light"></span></div>
          <div class="modem-led" data-led="cd"><span class="modem-led-label">CD</span><span class="modem-led-light"></span></div>
          <div class="modem-led" data-led="oh"><span class="modem-led-label">OH</span><span class="modem-led-light"></span></div>
          <div class="modem-led" data-led="rd"><span class="modem-led-label">RD</span><span class="modem-led-light"></span></div>
          <div class="modem-led" data-led="sd"><span class="modem-led-label">SD</span><span class="modem-led-light"></span></div>
          <div class="modem-led" data-led="tr"><span class="modem-led-label">TR</span><span class="modem-led-light"></span></div>
          <div class="modem-led" data-led="mr"><span class="modem-led-label">MR</span><span class="modem-led-light"></span></div>
          <div class="modem-led" data-led="cs"><span class="modem-led-label">CS</span><span class="modem-led-light"></span></div>
          <div class="modem-led" data-led="arq"><span class="modem-led-label">ARQ</span><span class="modem-led-light"></span></div>
        </div>
        <div class="modem-xfer" id="xferStrip" aria-live="polite" hidden>
          <span class="modem-xfer-dir" id="xferDir">▶</span>
          <span class="modem-xfer-name" id="xferName">—</span>
          <span class="modem-xfer-pct" id="xferPct">0%</span>
          <span class="modem-xfer-bar" id="xferBar"><span class="modem-xfer-fill" id="xferFill"></span></span>
          <span class="modem-xfer-cps" id="xferCps">0 CPS</span>
          <span class="modem-xfer-eta" id="xferEta">--:--</span>
          <span class="modem-xfer-batch" id="xferBatch" hidden></span>
        </div>
        <button class="modem-mute" id="muteBtn" title="Toggle modem sounds">
          <span class="modem-mute-icon" id="muteIcon">&#x1F50A;</span>
        </button>
        <div class="modem-brand">
          <span class="modem-brand-name">USPhonecs</span>
          <span class="modem-brand-model">Courier</span>
        </div>
      </div>
    </div>
  </div>
  <aside class="xfer-notifications" id="xferNotifications" aria-live="polite"></aside>
  <input type="file" id="xferUploadInput" multiple hidden />
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"
          integrity="sha384-M169f14mRZOXm3hD/v2Ti0ThIT/RnAQagXA9nlE15yHAtrW19gdePJh/HaTzUOe/"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.js"
          integrity="sha384-AkzdQDeATxpW8V7I2EPcwg17qAoLQMjEFHb//1QaAAIyIlbDAHGKno5+huH7RKxq"
          crossorigin="anonymous"></script>
  <script src="js/modem-audio.js"></script>
  <script src="js/cp437.js"></script>
  <script src="js/modem-state.js"></script>
  <script src="js/sticky-note.js"></script>
  <script src="js/xfer-util.js"></script>
  <script src="js/vendor/zmodem.min.js"></script>
  <script src="js/zmodem-ui.js"></script>
  <script src="js/zmodem-sentry.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
