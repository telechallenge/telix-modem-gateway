  # Example: number gated by a password. The modem rings and reports CONNECT
  # first, so the prompt (shadow-echoed as '*') looks like the BBS's own login;
  # wrong password -> NO CARRIER without ever touching the remote host.
  # - number: "555-0199"
  #   host: "private.example.com"
  #   port: 23
  #   name: "Private BBS"
  #   password: "swordfish"

dialer:
  # Restrict outbound connections to these networks.
  # If set, phonebook hosts must resolve to IPs within these CIDRs.
  # Leave empty to allow all destinations (not recommended in production).
  allowed_networks:

rate_limit:
  enabled: true
  max_attempts: 5
  window_seconds: 60
  block_duration: 300

metrics:
  # Prometheus exposition endpoint, on its own listener so it is never
  # reachable from a modem session on the telnet port.
  # Serves /metrics and /healthz.
  enabled: true
  port: 9101
  # Bind inside the container must stay open so Prometheus can reach it over
  # the compose network; the host-side exposure is restricted by the port
  # bindings in docker-compose.yml, not here.
  bind: "0.0.0.0"
