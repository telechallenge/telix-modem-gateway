server:
  port: 2323
  max_connections: 100
  max_per_ip: 5
  # Peers that are reverse proxies rather than callers, exempt from max_per_ip
  # and from rate_limit. Both are per-IP, and telix-web is one address carrying
  # every web-terminal user: at max_per_ip 5 the whole site was capped at five
  # concurrent browser users, and the sixth was refused outright.
  #
  # This is the Docker bridge pool rather than telix-net's current /16 on
  # purpose. Compose renumbers these networks when the stack is recreated —
  # observed here, telix-net moved from 172.18.0.0/16 to 172.19.0.0/16 and the
  # proxy's address moved with it. A pinned /16 would survive until the next
  # `docker compose down` and then silently reinstate the cap it exists to
  # remove. Nothing is lost by the wider range: port 2323 is published on
  # 0.0.0.0, so a real remote caller never arrives from private space.
  #
  # Note this trusts any container on this host, and that Docker's secondary
  # default pool (192.168.0.0/16) is not covered — if the host ever exceeds ~15
  # compose networks, check where telix-net landed.
  #
  # Global ceilings still bind the proxy: max_connections above is enforced for
  # it exactly as for anyone else. Per-browser-user limiting lives in the one
  # place that still knows who the user is — MAX_WS_PER_IP in web/server.js,
  # reading the address nginx puts in X-Real-IP.
  trusted_proxies:
    - "172.16.0.0/12"
  idle_timeout: 300  # seconds
  # Directory of ANSI art (.ANS); one file is picked at random per call and
  # drawn instead of the built-in TELIX banner. This is the path *inside the
  # container* — docker-compose mounts ./banners here. Empty, missing or holding
  # no .ans files falls back to the built-in banner, so the gateway runs fine
  # without it. Running outside Docker (make run)? Point this at ./banners.
  banner_dir: /etc/telix/banners

logging:
  level: info
  format: json
  file: ./logs/telix.log

