dialer:
  # Restrict outbound connections to these networks.
  # If set, phonebook hosts must resolve to IPs within these CIDRs.
  # Leave empty to allow all destinations (not recommended in production).
  allowed_networks:

rate_limit:
  enabled: true
  max_attempts: 5
  window_seconds: 60
  block_duration: 300
