dialer:
  # Restrict outbound connections to these networks.
  # If set, phonebook hosts must resolve to IPs within these CIDRs.
  # Leave empty to allow all destinations (not recommended in production).
  allowed_networks:

rate_limit:
  # OFF. It keys on conn.RemoteAddr() (internal/server/server.go), which for
  # every web-terminal caller is the telix-web container address — so the whole
  # browser population shared one bucket. At the settings below that meant the
  # sixth browser connection in any minute, from anyone, blocked the entire web
  # terminal for five minutes. Measured: six WebSocket connections in a burst
  # were dropped and logged as rate_limited against the proxy address.
  #
  # Disabling also switches off the global cap (globalMaxRate, 1000 per window)
  # that this limiter carries, since Allow() returns true before reaching it.
  # server.max_connections (100) is still enforced and is the remaining global
  # ceiling; it counts totals rather than per-IP, so the address collapse does
  # not distort it.
  #
  # The settings below are kept as the values to restore. Re-enabling without
  # first giving the gateway a real per-caller identity on the web path (PROXY
  # protocol across the last hop) reinstates the same self-DoS.
  enabled: false
  max_attempts: 5
  window_seconds: 60
  block_duration: 300

probe:
  # Periodic reachability check over the phonebook: every non-busy entry's
  # host:port is offered a TCP connection and the result published as
  # telix_bbs_reachable. Busy entries are skipped — they never place a call.
  #
  # This is a connect-and-hang-up, with no telnet negotiation, so a board does
  # not log it as a caller. It proves the line answers; it cannot prove anybody
  # can log in.
  #
  # Off by default, because some of these hosts belong to other people. interval
  # has a floor of 10s for the same reason.
  enabled: true
  interval: 60  # seconds between cycles
  timeout: 5    # seconds to wait for a connection

metrics:
  # Prometheus exposition endpoint, on its own listener so it is never
  # reachable from a modem session on the telnet port.
  # Serves /metrics and /healthz.
  enabled: true
  port: 9101
  # Bind inside the container must stay open so Prometheus can reach it over
  # the compose network; the host-side exposure is restricted by the port
  # bindings in docker-compose.yml, not here.
  bind: "0.0.0.0"

reload:
  # Watch this file and apply edits to the running gateway, so adding a board
  # or changing a limit does not mean restarting and dropping every call in
  # progress. Changes are picked up within `interval` seconds of saving.
  #
  # On by default, unlike probe: this reads one local file the operator already
  # controls and does nothing anybody else can observe.
  #
  # A change is applied only if it parses AND validates. A broken or half-saved
  # edit is logged as config_reload_failed and the gateway carries on with the
  # config it already has, so a typo costs a log line rather than an outage.
  #
  # NOT reloadable — these are reported as `needs_restart` on the reload log
  # line and require `docker compose restart telix`:
  #   server.port      the listener is already bound
  #   metrics.*        the exposition endpoint is already bound
  #   logging.file     the log writer is already open
  #   logging.format   switching mid-stream would mix two formats in one file
  # Everything else takes effect: the phonebook, logging.level, banner_dir,
  # idle_timeout, max_connections, max_per_ip, trusted_proxies, rate_limit,
  # dialer.allowed_networks and the probe settings.
  #
  # Callers already connected are never disturbed — a session keeps the config
  # it dialled under, and only the next caller sees the edit.
  enabled: true
  interval: 2  # seconds between polls; floor 1
