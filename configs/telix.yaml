server:
  port: 2323
  max_connections: 100
  max_per_ip: 5
  idle_timeout: 300  # seconds
  # Directory of ANSI art (.ANS); one file is picked at random per call and
  # drawn instead of the built-in TELIX banner. This is the path *inside the
  # container* — docker-compose mounts ./banners here. Empty, missing or holding
  # no .ans files falls back to the built-in banner, so the gateway runs fine
  # without it. Running outside Docker (make run)? Point this at ./banners.
  banner_dir: /etc/telix/banners

logging:
  level: info
  format: json
  file: ./logs/telix.log

